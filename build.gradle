plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'network' }
    // 통과한 시험은 조용히, 실패한 시험만 자세히
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// 실서버 시험 (@Tag("network")). 사람만 돌린다. 실서버 응답은 build/network/에 저장 (git 제외)
tasks.register('networkTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'network' }
    outputs.upToDateWhen { false } // 실서버는 매번 다시 본다
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
